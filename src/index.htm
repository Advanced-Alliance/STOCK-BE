<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO Client</title>
    <script
      src="https://cdn.socket.io/3.1.3/socket.io.min.js"
      integrity="sha384-cPwlPLvBTa3sKAgddT6krw0cJat7egBga3DJepJyrLl4Q9/5WLra3rrnMcyTyOnh"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <input type="text" id="messageInput" placeholder="Enter message" />
    <button onclick="sendMessage()">Send</button>
    <button onclick="createGame()">Create game</button>
    <input type="text" id="gameId" placeholder="XXXX" />
    <button onclick="joinGame()">Join</button>
    <ul id="messages"></ul>
    <script>
      const socket = io("http://localhost:8080");
      const messagesList = document.getElementById("messages");
      const gameSettings = {
        createDate: 1749675794031,
        lastEditQuestion: 0,
        lastEditDate: 1749675795529,
        game: {
          gameName: "Новая игра",
          showQuestionsText: true,
          maxFails: 3,
          gameType: "classic",
          questions: [
            {
              stageName: "Простая игра",
              questionText: "",
              orderBy: "none",
              enable: true,
              answers: [
                {
                  id: 0,
                  text: "Частый ответ",
                  points: 60,
                },
                {
                  id: 1,
                  text: "Средний ответ",
                  points: 30,
                },
                {
                  id: 2,
                  text: "Редкий ответ",
                  points: 10,
                },
              ],
            },
            {
              stageName: "Двойная игра",
              questionText: "",
              orderBy: "none",
              enable: true,
              answers: [
                {
                  id: 0,
                  text: "Частый ответ",
                  points: 60,
                },
                {
                  id: 1,
                  text: "Средний ответ",
                  points: 30,
                },
                {
                  id: 2,
                  text: "Редкий ответ",
                  points: 10,
                },
              ],
            },
          ],
          teamLeft: {
            fails: 0,
            players: [],
            points: 0,
          },
          teamRight: {
            fails: 0,
            players: [],
            points: 0,
          },
        },
      };

      socket.on("connect", () => {
        const message = `Connected to Socket.IO server, id ${socket.id}`;
        serverMessage(message);
      });

      socket.on("message", (data) => {
        serverMessage(data);
      });

      socket.on("disconnect", () => {
        const message = "Disconnected from Socket.IO server";
        serverMessage(message);
      });

      socket.on("connect_error", (error) => {
        console.error("WebSocket error:", error);
      });

      function sendMessage() {
        const messageInput = document.getElementById("messageInput");
        const message = messageInput.value;
        clientMessage(message);
        socket.emit("message", message);
        messageInput.value = "";
      }

      function createGame() {
        clientMessage("Попытка создать игору");
        socket.emit("createGame", gameSettings, (result) => {
          if (result) {
            clientMessage(`ID: ${result}`);
            return;
          }

          clientMessage("Абасрался");
        });
      }

      function joinGame() {
        const gameIdInput = document.getElementById("gameId");
        const id = gameIdInput.value;
        clientMessage(`Вхожу в ${id}`);

        socket.emit("joinGame", id, (result) => {
          if (result) {
            clientMessage(`Вошел`);
            return;
          }

          clientMessage("Абасрался");
        });
      }

      clientMessage = (message) => {
        const messageItem = document.createElement("li");
        messageItem.textContent = `Client: ${message}`;
        messagesList.appendChild(messageItem);
      };

      serverMessage = (message) => {
        const messageItem = document.createElement("li");
        messageItem.textContent = `Server: ${message}`;
        messagesList.appendChild(messageItem);
      };
    </script>
  </body>
</html>
